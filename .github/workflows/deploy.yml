name: Deploy hosted Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Structure check
        run: npm run check:structure

      - name: Unit tests
        run: npm run test

      - name: Deploy migrations + gateway + hosted smoke
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${PROJECT_REF}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "::error::Missing GitHub Environment secrets for 'hosted'."
            echo "Add these under Settings → Environments → hosted → Environment secrets:"
            echo "  SUPABASE_ACCESS_TOKEN  (Account → Access Tokens → sbp_…)"
            echo "  SUPABASE_PROJECT_REF   (from https://<ref>.supabase.co)"
            echo "  SUPABASE_ANON_KEY      (Project Settings → API → legacy JWT anon eyJ…)"
            exit 1
          fi
          npm run hosted:rehearsal
          # Do not set HOSTED_SMOKE=1 here — smoke seeds disposable data into the live project.
