name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Structure check
        run: npm run check:structure

      - name: Unit tests
        run: npm run test

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: |
          npx --yes supabase@latest start
          npx --yes supabase@latest status -o env > /tmp/supabase.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          set +a
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } > .env.local
          echo "SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_FUNCTIONS_URL=${API_URL}/functions/v1" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npx --yes supabase@latest db reset

      - name: Serve gateway in background
        run: |
          nohup npx --yes supabase@latest functions serve --env-file ./.env.local \
            > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Wait for gateway healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${VITE_SUPABASE_FUNCTIONS_URL}/gateway/healthz" >/dev/null; then
              echo "gateway ready"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy"
          tail -n 200 /tmp/gateway.log || true
          exit 1

      - name: Smoke
        run: npm run smoke
