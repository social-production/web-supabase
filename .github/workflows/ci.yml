name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Structure check
        run: npm run check:structure

      - name: Unit tests
        run: npm run test

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: |
          npx --yes supabase@latest start
          npx --yes supabase@latest status -o env > /tmp/supabase.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/supabase.env
          set +a
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            # functions serve skips SUPABASE_* from --env-file; SB_* aliases are accepted by shared client.
            echo "SB_URL=${API_URL}"
            echo "SB_ANON_KEY=${ANON_KEY}"
            echo "SB_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } > .env.local
          echo "SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_FUNCTIONS_URL=${FUNCTIONS_URL:-${API_URL}/functions/v1}" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npx --yes supabase@latest db reset

      - name: Serve gateway in background
        run: |
          nohup npx --yes supabase@latest functions serve --env-file ./.env.local \
            > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Wait for gateway healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS "${VITE_SUPABASE_FUNCTIONS_URL}/gateway/healthz" -o /tmp/healthz.json; then
              if python3 -c "import json; assert json.load(open('/tmp/healthz.json')).get('ok') is True"; then
                # Brief settle so the first smoke curl does not race serve startup.
                sleep 2
                echo "gateway ready (attempt ${i})"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "gateway did not become healthy"
          tail -n 200 /tmp/gateway.log || true
          exit 1

      - name: Smoke
        run: |
          set -euo pipefail
          npm run smoke || {
            echo "==== gateway.log ===="
            tail -n 300 /tmp/gateway.log || true
            echo "==== healthz ===="
            curl -sS -D- "${VITE_SUPABASE_FUNCTIONS_URL}/gateway/healthz" || true
            exit 1
          }
